name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTUP_MAX_RETRIES: 10

jobs:
  # What a pull request can reach (scripts/ci-scope.py): macOS runners are the scarce ones, so a
  # change that touches only docs, Linux-only code or other workflows skips the macOS jobs, and
  # one that can't reach the desktop or the emu release build skips that half of `emu-desktop`.
  # Pushes to main and manual runs run everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lint: ${{ steps.scope.outputs.lint }}
      desktop: ${{ steps.scope.outputs.desktop }}
      emu: ${{ steps.scope.outputs.emu }}
      macos: ${{ steps.scope.outputs.macos }}
    steps:
      # A pull request's checkout is its merge commit; its first parent is the base branch. A
      # rename lists both paths (--no-renames), and each path is judged in both trees (--base):
      # moving a file CI uses away, or gating one off macOS, counts by what it was. Scoping fails
      # safe: whatever ci-scope.py can't read, and the script failing outright, run everything.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: scope
        run: |
          set -o pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            scope() { git diff --no-renames --name-only HEAD^1 HEAD | python3 scripts/ci-scope.py changes --base HEAD^1; }
          else
            scope() { python3 scripts/ci-scope.py changes --all; }
          fi
          if ! scope > scope.txt; then
            echo "::warning::ci-scope.py failed: running every job"
            printf '%s\n' lint=true desktop=true emu=true macos=true > scope.txt
          fi
          cat scope.txt >> "$GITHUB_OUTPUT"

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      # The macOS test list names every crate with macOS-specific code, and Software mode's
      # pull_request paths every file its build reads (this reads `cargo metadata`).
      - run: python3 scripts/ci-scope.py check
      - run: cargo fmt --all --check
      - run: rustfmt --check --edition 2024 desktop/src/main.rs

  # The script and docs linters (scripts/lint.sh, configs at the root): shellcheck and shfmt over
  # the shell scripts, typos over code and docs, actionlint and yamllint over the workflows, and
  # lychee over the Markdown's links to files and anchors, offline. Seconds, on every change.
  docs-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: shellcheck@0.11.0,shfmt@3.14.1,typos@1.52.2
      # actionlint ships no install action: its release tarball, checked against the release's
      # SHA-256.
      - name: Install actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tgz="$RUNNER_TEMP/actionlint.tar.gz"
          curl -sSfL --retry 3 -o "$tgz" "https://github.com/rhysd/actionlint/releases/download/v$VERSION/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  $tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: pipx install yamllint==1.38.0
      - run: scripts/lint.sh --require shellcheck shfmt typos actionlint yamllint
      # lychee reads lychee.toml; its report goes to the job summary, outside the checkout.
      - if: ${{ !cancelled() }}
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: .
          output: ${{ runner.temp }}/lychee.md

  # The shared core, the API, the CLI and the Android device models build everywhere; the
  # macOS-only backends (and the VMM's hypervisor half) compile to nothing here, so this job checks
  # everything that isn't FFI without a macOS runner, and measures its coverage.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --all-targets --profile ci -- -D warnings
      # The Linux H.264 encoder, `simee-encode`'s `openh264` feature: off by default because it
      # builds OpenH264's C++ (g++ is on the runner) and `scripts/check.sh` lints the Linux target
      # from macOS with no C++ cross toolchain, so nothing above compiles it (nor simee-api's and simee's
      # Linux stream path behind the same feature). nasm gives it the
      # x86_64 assembly (2.4x faster; the build warns without it).
      - run: sudo apt-get install -y --no-install-recommends nasm || (sudo apt-get update && sudo apt-get install -y --no-install-recommends nasm)
      - run: cargo clippy --locked -p simee-encode -p simee-api -p simee --all-targets --features openh264 --profile ci -- -D warnings
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - run: cargo nextest run --locked -p simee-encode -p simee-api -p simee --features openh264 --cargo-profile ci --hide-progress-bar
      # The tests run once, instrumented. Per-file coverage goes to the job summary, and the job
      # fails when line coverage drops under the floor: raise it as coverage grows, never lower it
      # to get green.
      - run: cargo llvm-cov nextest --locked --workspace --cargo-profile ci --no-report --hide-progress-bar
      # x86_64 runners expose /dev/kvm (root:kvm 0660): open it to the runner user, then run
      # emu-kvm's tests that drive real KVM guests (ignored where there is no KVM).
      - uses: ./.github/actions/enable-kvm
      - run: cargo llvm-cov nextest --locked -p simee-emu-kvm --cargo-profile ci --no-report --hide-progress-bar --run-ignored only -E 'not test(notify_cost)'
      - run: |
          {
            echo '### Coverage (Linux)'
            echo '```text'
            cargo llvm-cov report --profile ci --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --profile ci --lcov --output-path lcov.info --fail-under-lines 85
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-linux
          path: lcov.info

  # The WebRTC publisher against a real MediaMTX (tests/mediamtx/mediamtx.yml), and the rest of
  # `simee-rtc`'s end-to-end tests: the `linux` job builds without the `rust-crypto` DTLS backend,
  # so those skip there. MediaMTX is the release pinned in scripts/mediamtx-fetch.sh, checked
  # against its SHA-256 on every run (the download is about a second; an Actions cache entry would
  # cost as much to restore and evict other entries from the full cache). `lint-test` runs the
  # same tests on macOS (it tests simee-rtc already). Setting
  # SIMEE_REQUIRE_MEDIAMTX makes a skipped MediaMTX test a failure, so a broken download or a
  # missing DTLS backend can't go green by skipping.
  mediamtx:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SIMEE_REQUIRE_MEDIAMTX: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      # Restore-only, from the `linux` job's entry: the repository's Actions cache is over its
      # limit, and a second Linux entry saved from main would evict older ones (macOS included).
      # What `linux` didn't build (aws-lc, for `rust-crypto`) compiles each run.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux
          save-if: false
      - name: MediaMTX
        run: |
          bin=$(scripts/mediamtx-fetch.sh "$RUNNER_TEMP/mediamtx")
          "$bin" --version
          echo "MEDIAMTX_BIN=$bin" >> "$GITHUB_ENV"
      - run: cargo test --locked --profile ci -p simee-rtc --features rust-crypto

  # What the KVM fast paths save, on real KVM (x86_64; GitHub's arm64 runners have no /dev/kvm,
  # see #54): a virtio-style doorbell store that exits to userspace against one completed in the
  # kernel by an ioeventfd. The numbers go to the job summary.
  kvm-x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: kvm-x86
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/enable-kvm
      - run: |
          cargo test --locked --release -p simee-emu-kvm notify_cost -- --ignored --nocapture | tee bench.txt
          { echo '### KVM notify cost (x86_64 runner)'; echo '```text'; grep notify_cost: bench.txt; nproc; grep -m1 'model name' /proc/cpuinfo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # The simulator service and Hypervisor.framework only exist on macOS, so the iOS and Android
  # backends are linted there (the whole workspace: cfg(macos) code only compiles there) and the
  # crates with macOS-specific code are tested there (.config/macos-tests.txt; the `linux` job
  # tests every crate). Unit tests don't need the hypervisor.
  lint-test:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A fresh runner's CoreSimulatorService can take longer than a test's 30 s to answer its
      # first connection (#110): start it now, in the background, so it is up by the tests.
      - run: (xcrun simctl list devices > /dev/null 2>&1 &)
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macos
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --all-targets --profile ci -- -D warnings
      # Prebuilt nextest runs the test binaries in parallel (doctests are disabled in this repo).
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest
      - name: Wait for the simulator service
        timeout-minutes: 5
        run: time xcrun simctl list devices > /dev/null
      # simee-rtc's MediaMTX tests (Apple's DTLS backend; the `mediamtx` job runs them on Linux):
      # the pinned, SHA-256-checked release, about a second. SIMEE_REQUIRE_MEDIAMTX below makes a
      # skipped MediaMTX test a failure.
      - name: MediaMTX
        run: |
          bin=$(scripts/mediamtx-fetch.sh "$RUNNER_TEMP/mediamtx")
          "$bin" --version
          echo "MEDIAMTX_BIN=$bin" >> "$GITHUB_ENV"
      - name: Test the crates with macOS-specific code
        env:
          SIMEE_REQUIRE_MEDIAMTX: "1"
        run: |
          packages=()
          while read -r name; do packages+=(-p "$name"); done < <(sed -e 's/#.*//' -e 's/[[:space:]]//g' -e '/^$/d' .config/macos-tests.txt)
          echo "${packages[@]}"
          cargo nextest run --locked --cargo-profile ci --hide-progress-bar "${packages[@]}"

  # The macOS builds beside lint-test, on one runner so a pull request takes two of the
  # account's macOS slots: the Android emulator's release binary (booting a guest needs nested
  # Hypervisor.framework, which hosted runners lack, so that stays a local check, docs/android.md)
  # and the desktop workspace. Each half runs only when the change can reach it, with its own
  # cache (release artifacts share nothing with the `ci` profile, and the desktop is its own
  # workspace).
  emu-desktop:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - if: needs.changes.outputs.emu == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macos-release
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: needs.changes.outputs.emu == 'true'
        run: cargo build --locked --release -p simee-emu
      - if: needs.changes.outputs.emu == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emu-macos-arm64
          path: target/release/emu
      - if: needs.changes.outputs.desktop == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
          shared-key: desktop
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: needs.changes.outputs.desktop == 'true'
        run: cd desktop && cargo clippy --locked --all-targets --profile ci -- -D warnings
      - if: needs.changes.outputs.desktop == 'true'
        run: cd desktop && cargo test --locked --profile ci

  # The window and its headless view tests also run on Linux: the iOS side compiles to a stub
  # there (desktop/src/device.rs), so labels, scenes and input mapping are checked without a Mac.
  desktop-linux:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner image's package index is usually fresh enough; refresh only when the install fails.
      - run: sudo apt-get install -y --no-install-recommends libxkbcommon-dev || (sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev)
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
          shared-key: desktop-linux
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cd desktop && cargo clippy --locked --all-targets --profile ci -- -D warnings
      - run: cd desktop && cargo test --locked --profile ci

  # One check that sums up the run, for the merge loop and branch protection: green when every
  # job passed or was skipped because the change can't reach it, red when any failed or was
  # cancelled (a failed `changes` fails it too, though the jobs after it show as skipped).
  ci-ok:
    if: always()
    needs: [changes, fmt, docs-scripts, linux, mediamtx, kvm-x86, lint-test, emu-desktop, desktop-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case $r in success | skipped) ;; *) exit 1 ;; esac
          done
