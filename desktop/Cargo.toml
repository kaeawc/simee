[package]
name = "simee-desktop"
description = "simee desktop app: one live, interactive window for iOS simulator and Android emulator devices, rendered with Rune."
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

# A workspace of its own: Rune is a large git dependency with a GPU stack. Keeping it out of the
# root workspace means `cargo check`/`test` at the root never fetch, resolve, or feature-unify it.
[workspace]

[[bin]]
name = "simee-desktop"
path = "src/main.rs"

[dependencies]
sim-core = { package = "simee-core", path = "../crates/sim-core" }
sim-coresim = { package = "simee-coresim", path = "../crates/sim-coresim" }
sim-debug = { package = "simee-debug", path = "../crates/sim-debug" }
sim-api = { package = "simee-api", path = "../crates/sim-api" }
sim-android = { package = "simee-android", path = "../crates/sim-android" }
sim-netshape = { package = "simee-netshape", path = "../crates/sim-netshape" }
serde = "1"
serde_json = "1"
# The 3D view's own pipeline (`src/scene/`) in a Rune compositor, which hands it Rune's wgpu
# device. Rune doesn't re-export wgpu: this is the version and features Rune already builds, so
# it adds no crate (its backends come from Rune's per-target features). Bump it with Rune's.
wgpu = { version = "30.0.2", default-features = false, features = ["std", "wgsl"] }
rune = { git = "https://github.com/anomalyco/rune", rev = "e08594ce74a1e9100e5842ab44be0ec5794a76c3" }

[features]
# Live Rust editing through Rune's devserver (`scripts/rune-dev` in the Rune repo).
hot = ["rune/hot"]
# Rune's headless flags (`--snap`, `--tree`, `--script`, `--video`, …) in release builds; debug
# builds always have them. Off by default: the shipped release app parses no Rune flags and links
# only its window. `cargo run --release --features tooling -- --snap shot.png --scene demo`.
tooling = ["rune/tooling"]

# Rune doesn't propagate its patches; apps must repeat them at the same rev. Bump all of these
# together with `rune` above.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "e08594ce74a1e9100e5842ab44be0ec5794a76c3" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "e08594ce74a1e9100e5842ab44be0ec5794a76c3" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "e08594ce74a1e9100e5842ab44be0ec5794a76c3" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "e08594ce74a1e9100e5842ab44be0ec5794a76c3" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "e08594ce74a1e9100e5842ab44be0ec5794a76c3" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "e08594ce74a1e9100e5842ab44be0ec5794a76c3" }
accesskit_atspi_common = { git = "https://github.com/anomalyco/rune", rev = "e08594ce74a1e9100e5842ab44be0ec5794a76c3" }
naga = { git = "https://github.com/anomalyco/rune", rev = "e08594ce74a1e9100e5842ab44be0ec5794a76c3" }

# `deny`, not `forbid`: only `src/surface.rs` (the zero-copy IOSurface bridge) opts back in.
[lints.rust]
unsafe_code = "deny"

[profile.dev]
debug = "line-tables-only"

# Rune's renderer and our pixel conversion run every frame: optimize dependencies and the core
# crates so a debug window stays smooth.
[profile.dev.package."*"]
debug = false
opt-level = 2

# `cargo test` and `cargo clippy` render nothing at speed (the view tests finish in ~0.1 s even at
# opt-level 0), so their dependencies, Rune's GPU stack above all, are built unoptimized: a clean
# build takes ~4x less CPU (614 s to ~146 s, docs/benchmarks.md). `cargo build`/`run` keep opt-level 2.
[profile.test.package."*"]
opt-level = 0

[profile.release]
codegen-units = 16
incremental = true

[profile.rune-hot]
inherits = "dev"
debug = 0
incremental = true

[profile.ci]
inherits = "dev"
debug = false
incremental = false

# `ci` inherits `dev`, so CI's clippy and tests build every dependency at opt-level 2. Keep that for
# the registry and git crates (Rune's GPU stack): they come from rust-cache, and opt-level 0 makes
# that cache 22% larger. The workspace's own crates, path dependencies here, rebuild on most pull
# requests, and nothing in the view tests needs them fast: build those at 0. A warm `cargo test
# --profile ci` after a sim-core edit, 4-CPU Linux VM: 29.8 s at 2, 17.4 s this way (#213).
# `scripts/ci-scope.py check` keeps this list equal to the path dependencies.
[profile.ci.package.simee-android]
opt-level = 0
[profile.ci.package.simee-api]
opt-level = 0
[profile.ci.package.simee-audio]
opt-level = 0
[profile.ci.package.simee-bundle]
opt-level = 0
[profile.ci.package.simee-camera]
opt-level = 0
[profile.ci.package.simee-core]
opt-level = 0
[profile.ci.package.simee-coresim]
opt-level = 0
[profile.ci.package.simee-debug]
opt-level = 0
[profile.ci.package.simee-emu-avd]
opt-level = 0
[profile.ci.package.simee-emu-hvf]
opt-level = 0
[profile.ci.package.simee-encode]
opt-level = 0
[profile.ci.package.simee-host]
opt-level = 0
[profile.ci.package.simee-netshape]
opt-level = 0
[profile.ci.package.simee-rtc]
opt-level = 0
