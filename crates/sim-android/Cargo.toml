[package]
name = "simee-android"
description = "The Android backend's client: lists AVDs as devices, starts and stops simee, drives running instances over their console and display socket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["android", "emulator", "avd", "adb", "mobile"]
categories = ["development-tools::testing", "emulators"]
include = ["/Cargo.toml", "/LICENSE", "/src"]

[lib]
doctest = false

[dependencies]
emu-avd.workspace = true
png.workspace = true
sim-core.workspace = true
# `usage::argv_from_procargs`, which reads a macOS process's arguments.
sim-host.workspace = true

# The macOS host's per-process reads (libproc), the calls `processes` and `connections` use.
[target.'cfg(target_os = "macos")'.dependencies]
sim-coresim.workspace = true

[features]
# The fake emulator in `testing`, for other crates' tests.
testing = []

[lints]
workspace = true
