[package]
name = "simee-mcp"
description = "simee's MCP server: every API method as a tool, devices as resources, long operations as tasks, and a device view as an MCP App, over stdio or Streamable HTTP."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["mcp", "ios", "android", "simulator", "emulator"]
categories = ["development-tools::testing", "simulation"]
include = ["/Cargo.toml", "/LICENSE", "/src"]

[lib]
doctest = false

[features]
# TLS for the HTTP transport (`simee mcp --http --tls-cert/--tls-key`, `--tls-self-signed`): rustls
# with the ring provider, TLS 1.3 only. Off by default: it adds a C build (ring).
tls = ["dep:rustls", "dep:rcgen", "dep:ring"]

[dependencies]
serde_json.workspace = true
rustls = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
ring = { workspace = true, optional = true }
sim-api.workspace = true

# The HTTP transport's token file: opened without following links, its owner checked against the
# effective user.
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
base64.workspace = true
sim-core.workspace = true
emu-avd.workspace = true
sim-android = { workspace = true, features = ["testing"] }

[lints]
workspace = true
