[package]
name = "simee-bundle"
description = "Portable device bundles: a manifest, content-addressed LZ4 chunks, and the same as one plain tar; verified on import."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["android", "emulator", "snapshot", "bundle", "lz4"]
categories = ["development-tools::testing", "compression"]
include = ["/Cargo.toml", "/LICENSE", "/src"]

[lib]
doctest = false

[dependencies]
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
sim-core.workspace = true
thiserror.workspace = true
lz4_flex.workspace = true
unicode-normalization.workspace = true

# Writing under an import's destination through directory fds, never following a link.
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[lints]
workspace = true
