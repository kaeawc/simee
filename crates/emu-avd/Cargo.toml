[package]
name = "simee-emu-avd"
description = "AVD discovery and config: ini files, system image resolution, bootconfig, form factor, running instances."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["android", "emulator", "avd", "mobile"]
categories = ["emulators", "development-tools::testing"]
include = ["/Cargo.toml", "/LICENSE", "/src"]

[lib]
doctest = false

[dependencies]
sim-bundle.workspace = true
sim-core.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

# Process checks the standard library lacks on Windows (`emu_hvf::host`).
[target.'cfg(windows)'.dependencies]
emu-hvf.workspace = true

[lints]
workspace = true
