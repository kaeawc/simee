[package]
name = "simee-core"
description = "Pure simee building blocks: device models, platforms and form factors, geometry, frames and pixel conversion, HID usages, gestures."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["ios", "android", "simulator", "emulator", "mobile"]
categories = ["development-tools::testing", "simulation"]
include = ["/Cargo.toml", "/LICENSE", "/examples", "/src", "/testdata"]

[lib]
doctest = false

[dependencies]
png.workspace = true
serde.workspace = true

# `entropy`: not for wasm, where getrandom needs a JS backend this crate has no use for.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
getrandom.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
