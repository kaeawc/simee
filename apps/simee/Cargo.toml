[package]
name = "simee"
description = "simee CLI: create, boot and drive iOS simulator and Android emulator devices; capture the screen; inject input."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["ios", "android", "simulator", "emulator", "mcp"]
categories = ["command-line-utilities", "development-tools::testing", "emulators"]
include = ["/Cargo.toml", "/LICENSE", "/src", "/tests"]

[[bin]]
name = "simee"
path = "src/main.rs"

[lints]
workspace = true

[features]
# `stream_start` on Linux: OpenH264, built from its C++ source (needs a C++ compiler; `nasm` makes
# it several times faster on x86_64). Off by default; macOS streams with VideoToolbox without it.
openh264 = ["sim-api/openh264"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
sim-android.workspace = true
sim-api.workspace = true
sim-core.workspace = true
sim-host.workspace = true
sim-mcp.workspace = true

[dev-dependencies]
emu-avd.workspace = true
png.workspace = true
serde_json.workspace = true
sim-android = { workspace = true, features = ["testing"] }
