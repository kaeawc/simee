[package]
name = "simee-website"
description = "simee's public website, drawn by Rune: the home page, the docs, device concepts and demos."
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

# A workspace of its own, like desktop/: Rune is a large git dependency with a GPU stack, and the
# root workspace's `cargo check`/`test` never fetch it.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[[bin]]
name = "simee-website"
path = "src/main.rs"

[dependencies]
# The device concepts page reads the support matrix and reference profiles from the same code the
# CLI and API use, so it can't drift from what simee does.
sim-core = { package = "simee-core", path = "../crates/sim-core" }
# Same version Rune's Markdown parses with: the docs' heading anchors are keyed from it.
pulldown-cmark = { version = "0.13", default-features = false }
rune = { git = "https://github.com/anomalyco/rune", rev = "f6f6e045b8cd1bce6111ab65e1b50d84f93d045b" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "f6f6e045b8cd1bce6111ab65e1b50d84f93d045b", features = ["markdown"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", default-features = false, features = ["Window", "Location", "Storage", "Document", "Element"] }

[features]
# Rune's headless flags (`--snap`, `--tree`) in release builds; debug builds always have them.
tooling = ["rune/tooling"]

# Rune doesn't propagate its patches; repeat them at the same rev as `rune` above. Bump these
# together with desktop/Cargo.toml's.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "f6f6e045b8cd1bce6111ab65e1b50d84f93d045b" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "f6f6e045b8cd1bce6111ab65e1b50d84f93d045b" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "f6f6e045b8cd1bce6111ab65e1b50d84f93d045b" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "f6f6e045b8cd1bce6111ab65e1b50d84f93d045b" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "f6f6e045b8cd1bce6111ab65e1b50d84f93d045b" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "f6f6e045b8cd1bce6111ab65e1b50d84f93d045b" }
accesskit_atspi_common = { git = "https://github.com/anomalyco/rune", rev = "f6f6e045b8cd1bce6111ab65e1b50d84f93d045b" }
naga = { git = "https://github.com/anomalyco/rune", rev = "f6f6e045b8cd1bce6111ab65e1b50d84f93d045b" }

[lints.rust]
unsafe_code = "forbid"

[profile.dev.package."*"]
debug = false
opt-level = 2
