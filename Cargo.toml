[workspace]
resolver = "3"
# sim-* crates: the shared core (sim-core, sim-api) and the iOS backend; emu-* crates: the Android
# backend (an emulator on Hypervisor.framework); apps: the simee CLI and the emu emulator binary.
members = ["crates/*", "apps/simee", "apps/emu"]
# The Rune desktop app is its own workspace: a large git dependency and a GPU stack stay out of
# `cargo check`/`test` here.
exclude = ["desktop"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/kaeawc/simee"
homepage = "https://github.com/kaeawc/simee"

# Every crate inherits deps from here, so each dependency is built with one feature set no matter
# which `-p` subset you build.
[workspace.dependencies]
# The workspace crates, published to crates.io as `simee-*` (scripts/publish.sh), each library
# named after its package (`simee_core`). The keys keep the old names, so dependents say
# `sim_core::`; the `=` pins move with the workspace version (scripts/release.sh).
sim-core = { package = "simee-core", path = "crates/sim-core", version = "=0.2.0" }
sim-coresim = { package = "simee-coresim", path = "crates/sim-coresim", version = "=0.2.0" }
sim-debug = { package = "simee-debug", path = "crates/sim-debug", version = "=0.2.0" }
sim-api = { package = "simee-api", path = "crates/sim-api", version = "=0.2.0" }
sim-mcp = { package = "simee-mcp", path = "crates/sim-mcp", version = "=0.2.0" }
sim-netshape = { package = "simee-netshape", path = "crates/sim-netshape", version = "=0.2.0" }
sim-host = { package = "simee-host", path = "crates/sim-host", version = "=0.2.0" }
sim-audio = { package = "simee-audio", path = "crates/sim-audio", version = "=0.2.0" }
sim-camera = { package = "simee-camera", path = "crates/sim-camera", version = "=0.2.0" }
sim-android = { package = "simee-android", path = "crates/sim-android", version = "=0.2.0" }
sim-bundle = { package = "simee-bundle", path = "crates/sim-bundle", version = "=0.2.0" }
sim-rtc = { package = "simee-rtc", path = "crates/sim-rtc", version = "=0.2.0" }
sim-encode = { package = "simee-encode", path = "crates/sim-encode", version = "=0.2.0" }
emu-container = { package = "simee-emu-container", path = "crates/emu-container", version = "=0.2.0" }
emu-avd = { package = "simee-emu-avd", path = "crates/emu-avd", version = "=0.2.0" }
emu-gfxstream = { package = "simee-emu-gfxstream", path = "crates/emu-gfxstream", version = "=0.2.0" }
emu-ext4 = { package = "simee-emu-ext4", path = "crates/emu-ext4", version = "=0.2.0" }
emu-fdt = { package = "simee-emu-fdt", path = "crates/emu-fdt", version = "=0.2.0" }
emu-hvf = { package = "simee-emu-hvf", path = "crates/emu-hvf", version = "=0.2.0" }
emu-kvm = { package = "simee-emu-kvm", path = "crates/emu-kvm", version = "=0.2.0" }
emu-sdk = { package = "simee-emu-sdk", path = "crates/emu-sdk", version = "=0.2.0" }
emu-vmm = { package = "simee-emu-vmm", path = "crates/emu-vmm", version = "=0.2.0" }

anyhow = "1"
base64 = "0.23"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "env"] }
png = { version = "0.18", default-features = false }
# Camera sources (sim-camera): `image:<path>` JPEG decoding (pure Rust, the decoder the desktop's
# image stack already uses), `qr:<text>` encoding (Nayuki's reference encoder, no dependencies) and
# the 8x8 bitmap font the test card and `text:<text>` draw with (public domain, data only).
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }
qrcodegen = { version = "1", default-features = false }
font8x8 = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
thiserror = "2"
crc32fast = { version = "1", default-features = false, features = ["std"] }
# zlib-rs: ~2x miniz_oxide's inflate on a gzip kernel; runtime_detection lets it use the CPU's
# crc32 instructions.
flate2 = { version = "1", default-features = false, features = ["zlib-rs", "runtime_detection"] }
libc = { version = "0.2", default-features = false }
# Safe syscall wrappers (plain fsync: std's sync_data is F_FULLFSYNC on macOS; the adb bridge's
# non-blocking send).
rustix = { version = "1", default-features = false, features = ["event", "fs", "mount", "net", "process", "std"] }
# SIGINT/SIGTERM for `simee serve` and `simee mcp` (sim-api's `shutdown`, #388): its iterator's
# handler only writes to a self-pipe; a thread of the server's own does the shutdown.
signal-hook = { version = "0.4.6", default-features = false, features = ["iterator"] }
# SHA-256 for the container backend's image pins (emu-container): the digest every OCI blob is
# checked against before it is unpacked.
sha2 = { version = "0.11", default-features = false }
# The user-mode NAT behind virtio-net (emu-vmm): smoltcp's TCP state machine, in safe Rust. Its
# unsafe code is only in the tap, raw-socket and bpf backends, which stay off.
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "socket-tcp"] }
# SDK repository manifests (emu-sdk): a small read-only XML tree.
roxmltree = { version = "0.21", default-features = false, features = ["std"] }
# The SDK repository publishes sha1 checksums; dependency-free pure Rust.
sha1_smol = { version = "1", default-features = false }
# Device bundles (sim-bundle): chunk and whole-disk hashes, and per-chunk compression. blake3's
# `std` gives `update_reader` (it falls back to Rust intrinsics when no C compiler targets the
# build). lz4_flex is pure Rust with its unsafe fast paths off (`safe-encode`, `safe-decode`): no
# C toolchain, so `scripts/check.sh` lints the Linux target from macOS too.
blake3 = { version = "1", default-features = false, features = ["std"] }
lz4_flex = { version = "0.14", default-features = false, features = ["safe-encode", "safe-decode"] }
# Host audio for emu's virtio-snd card (CoreAudio on macOS; emu-vmm only, macOS only).
cpal = { version = "0.18", default-features = false }
# Linux KVM (emu-kvm only): the rust-vmm ioctl wrappers Firecracker and Cloud Hypervisor use,
# the generated uapi structs, and their eventfd/signal helpers.
kvm-ioctls = { version = "0.25", default-features = false }
kvm-bindings = { version = "0.14", default-features = false }
vmm-sys-util = { version = "0.15", default-features = false }
# Software H.264 for Linux (sim-encode's `openh264` feature): Cisco's OpenH264 built from its C++
# source (`source`), which needs a C++ compiler (and `nasm` for the x86 SIMD) and so is opt-in:
# the Linux cross-clippy from macOS has no C++ cross toolchain. `-sys2` is for the one call the
# safe crate lacks (a runtime bitrate change).
openh264 = { version = "0.9", default-features = false, features = ["source"] }
openh264-sys2 = { version = "0.9", default-features = false }
# WebRTC for the WHIP publisher (sim-rtc): sans-IO, no async runtime (webrtc-rs needs tokio). No
# crypto backend here: sim-rtc picks CryptoKit on Apple targets and opts into RustCrypto on Linux
# (whose certificate generation builds aws-lc's C, which would break cross-target clippy).
str0m = { version = "0.26", default-features = false }
# Objective-C runtime bindings. Only sim-coresim may depend on these.
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"] }
# Objective-C blocks, for the simulator service's completion handlers (sim-coresim only).
block2 = { version = "0.6", default-features = false, features = ["std"] }

# unsafe is forbidden everywhere except the FFI crates, which set their own lints: sim-coresim
# (Objective-C), emu-hvf (Hypervisor.framework, guest RAM), emu-kvm (Linux KVM), emu-gfxstream (the renderer),
# sim-encode (one OpenH264 call, `deny` and allowed on that function) and
# apps/emu (one signal-mask function, so `deny` there instead of `forbid`).
[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"

[profile.dev]
debug = "line-tables-only"
# 16 codegen units instead of the dev default 256: fewer, larger units cut incremental relink and
# per-unit bookkeeping (docs/build.md: sim-core one-line change 2.2 s to 1.3 s).
codegen-units = 16

[profile.dev.package."*"]
debug = false
opt-level = 0

# The dependencies on a runtime hot path stay optimized in dev builds: the kernel's gunzip, the
# NAT's TCP state machine, checksums and PNG encoding. Everything else (serde, clap and their
# proc macros, syn, the Objective-C bindings) costs ~40% of a clean build's CPU time at opt-level 2
# and runs only at startup.
[profile.dev.package.zlib-rs]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.smoltcp]
opt-level = 2
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3
[profile.dev.package.base64]
opt-level = 3
# `-provision` checks each multi-GB system image download's SHA-1.
[profile.dev.package.sha1_smol]
opt-level = 3
[profile.dev.package.cpal]
opt-level = 2

# The Android VMM sits on the guest's hot path (every MMIO exit, every block request); unoptimized
# it boots the guest several times slower.
[profile.dev.package.simee-emu-vmm]
opt-level = 1
[profile.dev.package.simee-emu-hvf]
opt-level = 1
[profile.dev.package.simee-emu-gfxstream]
opt-level = 1
[profile.dev.package.simee-emu]
opt-level = 1

# Tests don't run guests: build the VMM crates unoptimized there, which takes the incremental
# test build after a sim-core change from ~17 s to ~10 s (opt-level 1 is for running `emu`).
[profile.test.package.simee-emu-vmm]
opt-level = 0
[profile.test.package.simee-emu-hvf]
opt-level = 0
[profile.test.package.simee-emu]
opt-level = 0

# PNG encoding of full-resolution framebuffers is the hot path of `screenshot` in debug builds.
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.build-override]
opt-level = 0
debug = false

[profile.release]
codegen-units = 16
incremental = true
strip = "debuginfo"

[profile.dist]
inherits = "release"
codegen-units = 1
incremental = false
lto = "thin"
strip = true

[profile.ci]
inherits = "dev"
debug = false
incremental = false
