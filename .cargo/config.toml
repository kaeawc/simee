[alias]
# The inner loop: type-check everything (no codegen, no linking).
c = "check --all-targets"
# Lint like CI does.
lint = "clippy --all-targets -- -D warnings"
# The repository's own automation, the same checks as scripts/check.sh on any host (Windows has no
# bash): `cargo xtask check [--quick|--all]`.
xtask = "run --package xtask --"
# Tests through nextest (one process per test, parallel across binaries).
t = "nextest run"
# Tests in a single crate without touching the rest.
tc = "nextest run -p simee-core"

# Hypervisor.framework refuses unsigned callers. Every binary cargo runs (the `emu` emulator, the
# simee CLI and test binaries) is ad-hoc signed with the hypervisor entitlement first; for
# binaries that don't use it the signature changes nothing.
[target.aarch64-apple-darwin]
runner = "scripts/sign-run.sh"

# Windows: the C runtime is linked in, so `simee.exe` and `emu.exe` run without the Visual C++
# redistributable installed. Hosts build with the same flags (no `--target`), so build scripts and
# proc macros do too. The main thread's stack is 8 MiB, what macOS and Linux give it: Windows'
# default of 1 MiB overflows `simee`'s command dispatch in a debug build.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=/STACK:8388608"]

[env]
RUST_BACKTRACE = { value = "short", force = false }
